<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>SIKA - Form Mahasiswa</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <h1>SIKA</h1>
      <p>Sistem Informasi Akademik</p>
    </div>
  </header>

  <nav aria-label="Navigasi utama">
    <div class="container">
      <ul>
        <li><a href="index.html">Dashboard</a></li>
        <li><a href="mahasiswa.html">Profil Mahasiswa</a></li>
        <li><a href="form-mahasiswa.html">Form Mahasiswa</a></li>
      </ul>
    </div>
  </nav>

  <main class="container">
    <h1>Form Data Mahasiswa</h1>

    <form id="formMahasiswa" action="#" method="post" novalidate>
      <div class="form-group">
        <label for="nim">NIM</label>
        <input type="text" id="nim" name="nim" maxlength="8">
        <small id="errorNim" class="error-message"></small>
      </div>

      <div class="form-group">
        <label for="nama">Nama Lengkap</label>
        <input type="text" id="nama" name="nama">
        <small id="errorNama" class="error-message"></small>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email">
        <small id="errorEmail" class="error-message"></small>
      </div>

      <div class="form-group">
        <label for="prodi">Program Studi</label>
        <select id="prodi" name="prodi">
          <option value="">-- Pilih Program Studi --</option>
          <option value="TI">Teknik Informatika</option>
          <option value="SI">Sistem Informasi</option>
        </select>
        <small id="errorProdi" class="error-message"></small>
      </div>

      <button type="submit">Simpan</button>
    </form>
  </main>

  <footer>
    <div class="container">
      <p>&copy; 2026 SIKA</p>
    </div>
  </footer>

  <script src="assets/js/app.js"></script>
</body>
</html>
